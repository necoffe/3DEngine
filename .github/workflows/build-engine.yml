name: Build io3DEngine (NOVERA)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Siapkan Version.h + matikan step SVN (SubWCRev)
        shell: pwsh
        run: |
          # 1) Version.h manual (isinya cuma identifier build)
          @"
          #pragma once
          #define IO3DENGINE_VERSION "0.0.0.0"
          #define IO3DENGINE_VERSION_STR "0.0.0.0"
          "# | Set-Content -Encoding ASCII Version.h
          Write-Host "Version.h dibuat:"; Get-Content Version.h
          # 2) buang PreBuildEvent/CustomBuild yg jalanin SubWCRev.exe
          $x = Get-Content io3DEngine.vcxproj -Raw
          $x = [regex]::Replace($x, '(?s)<PreBuildEvent>.*?</PreBuildEvent>', '<PreBuildEvent></PreBuildEvent>')
          $x = [regex]::Replace($x, '(?s)<CustomBuild.*?</CustomBuild>', '')
          $x = [regex]::Replace($x, '(?s)<PropertyGroup>\s*<SubWCRev[^>]*>.*?</PropertyGroup>', '')
          $x = $x -replace '(?s)<Command>.*?SubWCRev\.exe.*?</Command>', '<Command>echo skip svn</Command>'
          Set-Content io3DEngine.vcxproj $x -Encoding ASCII
          Write-Host "sisa referensi SubWCRev:"; (Select-String -Path io3DEngine.vcxproj -Pattern 'SubWCRev' -SimpleMatch | Measure-Object).Count
      - name: Build io3DEngine Release
        shell: pwsh
        run: |
          msbuild io3DEngine.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal 2>&1 | Tee-Object build-engine.log
      - name: Kumpulkan hasil
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter io3DEngine.dll -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName $_.Length }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Recurse -Filter io3DEngine.dll -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName out\ -Force }
          Copy-Item build-engine.log out\ -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: EngineBuild
          path: out/**
          retention-days: 14
