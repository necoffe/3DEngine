name: Build io3DEngine (NOVERA)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Siapkan Version.h + matikan step SVN (SubWCRev)
        shell: pwsh
        run: |
          $vh = '#pragma once' + "`n" + '#define IO3DENGINE_VERSION "0.0.0.0"' + "`n"
          [System.IO.File]::WriteAllText("$PWD\Version.h", $vh)
          Write-Host "Version.h:"; Get-Content Version.h
          $x = Get-Content io3DEngine.vcxproj -Raw
          $x = [regex]::Replace($x, '(?s)<PreBuildEvent>.*?</PreBuildEvent>', '<PreBuildEvent></PreBuildEvent>')
          $x = [regex]::Replace($x, '(?s)<CustomBuild.*?</CustomBuild>', '')
          $x = $x -replace '(?s)<Command>.*?SubWCRev\.exe.*?</Command>', '<Command>echo skip svn</Command>'
          Set-Content io3DEngine.vcxproj $x
          Write-Host ("sisa SubWCRev: " + (Select-String -Path io3DEngine.vcxproj -Pattern 'SubWCRev' -SimpleMatch | Measure-Object).Count)
      - name: Build io3DEngine Release
        shell: pwsh
        env:
          DXSDK_DIR: ${{ github.workspace }}\lib\DXSDK\
        run: |
          $env:DXSDK_DIR = "${{ github.workspace }}\lib\DXSDK\"
          Write-Host "DXSDK_DIR=$env:DXSDK_DIR"
          Write-Host "cek d3dx9.h: $(Test-Path (Join-Path $env:DXSDK_DIR 'Include\d3dx9.h'))"
          Write-Host "cek d3d9.lib: $(Test-Path (Join-Path $env:DXSDK_DIR 'lib\x86\d3d9.lib'))"
          msbuild io3DEngine.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal 2>&1 | Tee-Object build-engine.log
      - name: Kumpulkan hasil
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter io3DEngine.dll -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName $_.Length }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Recurse -Filter io3DEngine.dll -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName out\ -Force }
          Copy-Item build-engine.log out\ -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: EngineBuild
          path: out/**
          retention-days: 14
